<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Training Dashboard</title>
<style>
  :root {
    --bg: #0f1115; --card: #171a21; --card2: #1d2129; --border: #2a2f3a;
    --text: #e8eaf0; --muted: #8b93a3; --accent: #4f8ef7;
    --green: #3ecf8e; --amber: #f5b14c; --red: #ef6461;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 15px; line-height: 1.45; }
  .wrap { max-width: 760px; margin: 0 auto; padding: 16px 14px 60px; }

  /* header */
  header { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
  header h1 { font-size: 19px; font-weight: 700; flex: 1; }
  header h1 span { color: var(--accent); }
  .icon-btn { background: var(--card); border: 1px solid var(--border); color: var(--muted); border-radius: 8px; padding: 6px 10px; cursor: pointer; font-size: 13px; }
  select.person-switch { background: var(--card); color: var(--text); border: 1px solid var(--border); border-radius: 8px; padding: 6px 8px; font-size: 13px; }

  /* nav */
  nav { display: flex; gap: 6px; margin-bottom: 16px; flex-wrap: wrap; }
  .nav-link { background: var(--card); border: 1px solid var(--border); color: var(--muted); border-radius: 999px; padding: 7px 14px; font-size: 13px; font-weight: 600; cursor: pointer; }
  .nav-link.active { background: var(--accent); border-color: var(--accent); color: #fff; }

  /* cards */
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; margin-bottom: 14px; }
  .card h2 { font-size: 12px; text-transform: uppercase; letter-spacing: 0.6px; color: var(--muted); margin-bottom: 10px; }
  .card h3 { font-size: 15px; margin-bottom: 6px; }
  .muted { color: var(--muted); font-size: 13px; }
  .note { color: var(--muted); font-size: 13px; margin: 6px 0; }

  /* week strip */
  .week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; }
  .week .day { background: var(--card2); border: 1px solid var(--border); border-radius: 8px; padding: 6px 4px; text-align: center; font-size: 10.5px; color: var(--muted); }
  .week .day b { display: block; font-size: 11px; color: var(--text); margin-bottom: 2px; }
  .week .day.today { border-color: var(--accent); background: rgba(79,142,247,0.12); }

  /* readiness */
  .ready-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 10px; }
  .ready-item label { display: block; font-size: 11px; color: var(--muted); margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.4px; }
  .ready-item select { width: 100%; background: var(--card2); color: var(--text); border: 1px solid var(--border); border-radius: 8px; padding: 7px 6px; font-size: 14px; }
  .badge { display: inline-block; border-radius: 999px; padding: 4px 12px; font-size: 12.5px; font-weight: 700; }
  .badge.green { background: rgba(62,207,142,0.15); color: var(--green); }
  .badge.amber { background: rgba(245,177,76,0.15); color: var(--amber); }
  .badge.red   { background: rgba(239,100,97,0.15);  color: var(--red); }
  /* mesocycle / deload */
  .meso { color: var(--muted); font-size: 12.5px; margin-top: 8px; }
  .deload { margin-top: 10px; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--amber); background: rgba(245,177,76,0.12); font-size: 13px; }
  .deload b { color: var(--amber); }
  .ready-advice { font-size: 13px; color: var(--muted); margin-top: 6px; }

  /* tables */
  table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  th { text-align: left; color: var(--muted); font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: 0.4px; padding: 0 6px 7px 0; border-bottom: 1px solid var(--border); }
  td { padding: 7px 6px 7px 0; border-bottom: 1px solid var(--border); vertical-align: middle; }
  tr:last-child td { border-bottom: none; }
  td.num, th.num { text-align: right; }
  .exname { font-weight: 600; }
  .target { color: var(--muted); font-size: 12px; }
  .load-input { width: 74px; background: var(--card2); color: var(--text); border: 1px solid var(--border); border-radius: 8px; padding: 6px 8px; text-align: center; font-size: 13.5px; }
  .totals td { font-weight: 700; border-top: 1px solid var(--border); }

  /* per-exercise row with per-set reps */
  .ex-row { padding: 10px 0; border-bottom: 1px solid var(--border); }
  .ex-row:last-of-type { border-bottom: none; }
  .ex-head { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; margin-bottom: 6px; }
  .ex-head .target { font-size: 12px; }
  .hint-up { font-size: 11px; font-weight: 700; color: var(--green); background: rgba(62,207,142,0.12); border-radius: 999px; padding: 2px 8px; }
  .ex-inputs { display: flex; align-items: center; gap: 5px; flex-wrap: wrap; }
  .ex-x { color: var(--muted); font-size: 13px; }
  .rep-input { width: 44px; background: var(--card2); color: var(--text); border: 1px solid var(--border); border-radius: 8px; padding: 6px 4px; text-align: center; font-size: 13.5px; }
  .ex-reps-label { color: var(--muted); font-size: 11px; }
  .ex-last { color: var(--muted); font-size: 11.5px; margin-top: 4px; }

  ul.opts { margin: 6px 0 6px 18px; }
  ul.opts li { margin-bottom: 4px; font-size: 13.5px; }

  /* buttons / inputs */
  .btn { background: var(--accent); border: none; color: #fff; border-radius: 10px; padding: 11px 16px; font-size: 14px; font-weight: 700; cursor: pointer; width: 100%; margin-top: 10px; }
  .btn:disabled { opacity: 0.45; cursor: not-allowed; }
  textarea, input[type=text], input[type=password], input[type=date] { width: 100%; background: var(--card2); color: var(--text); border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; font-size: 13.5px; font-family: inherit; }
  input[type=date] { color-scheme: dark; }
  .field { margin-top: 10px; }
  .field label { display: block; font-size: 11px; color: var(--muted); margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.4px; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .status-msg { font-size: 13px; margin-top: 8px; }
  .select-full { width: 100%; background: var(--card2); color: var(--text); border: 1px solid var(--border); border-radius: 8px; padding: 8px; font-size: 14px; }

  @media (max-width: 430px) {
    .ready-grid { grid-template-columns: repeat(2, 1fr); }
    .week .day { font-size: 9.5px; padding: 5px 2px; }
  }

  /* skills */
  .skill { margin-bottom: 12px; }
  .skill .head { display: flex; justify-content: space-between; font-size: 13.5px; margin-bottom: 4px; }
  .skill .stage { color: var(--muted); font-size: 12px; }
  .bar { height: 6px; background: var(--card2); border-radius: 999px; overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--accent); border-radius: 999px; }
  .cat-title { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; margin: 14px 0 8px; }

  /* log entries */
  .entry { border-bottom: 1px solid var(--border); padding: 10px 0; font-size: 13.5px; }
  .entry:last-child { border-bottom: none; }
  .entry .ehead { font-weight: 700; margin-bottom: 3px; }
  .entry .ehead span { color: var(--accent); font-weight: 600; }
  .entry pre { white-space: pre-wrap; color: var(--muted); font-family: inherit; font-size: 12.5px; }

  /* modal */
  .modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,0.6); display: none; align-items: center; justify-content: center; padding: 16px; z-index: 50; }
  .modal-bg.show { display: flex; }
  .modal { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 18px; max-width: 420px; width: 100%; }
  .modal h3 { margin-bottom: 8px; }
  .modal p { font-size: 13px; color: var(--muted); margin-bottom: 10px; }

  .hidden { display: none !important; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 id="title">Training — <span id="person-name">…</span></h1>
    <select class="person-switch" id="person-switch" onchange="switchPerson(this.value)"></select>
    <button class="icon-btn" onclick="showTokenModal()">⚙︎</button>
  </header>

  <nav id="nav"></nav>

  <div id="views"></div>
  <div class="muted" id="boot-msg">Loading…</div>
</div>

<div class="modal-bg" id="token-modal">
  <div class="modal">
    <h3>GitHub token</h3>
    <p>A fine-grained personal access token with read/write access to this repo's contents. Needed to save log entries (and for fresh reads). Stored only in this browser.</p>
    <input type="password" id="token-input" placeholder="github_pat_…">
    <button class="btn" onclick="saveToken()">Save</button>
    <button class="btn" style="background:var(--card2);margin-top:8px" onclick="hideTokenModal()">Close</button>
  </div>
</div>

<script>
// ─────────────────────────────────────────────────────────────
// CONFIG-DRIVEN DASHBOARD
// One template for every person. Person config lives in
// people/<id>/data.json — see people/_template/README.md.
// ─────────────────────────────────────────────────────────────
const REPO = 'denisandreenko/sport-agent';
const DAY_NAMES = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const READY_FIELDS = [
  { key: 'sleep',      label: 'Sleep' },
  { key: 'soreness',   label: 'Soreness' },   // 5 = no soreness
  { key: 'energy',     label: 'Energy' },
  { key: 'motivation', label: 'Motivation' }
];

let P = null;            // person config (data.json)
let personId = '';
let logContent = '', logSha = '';
let skillState = {};
let lastLoads = {};
let currentType = '';
let selectedDate = '';   // day being logged or edited (YYYY-MM-DD, local time)
let dayEntry = null;     // parsed log entry for selectedDate; null when that day isn't logged yet
let readiness = {};      // readiness ratings for selectedDate
let formRows = [];       // gym rows on the form: planned exercises + logged ones no longer in the plan

// ── helpers ──────────────────────────────────────────────────
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function todayISO() { const d = new Date(); return new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10); }
const MONTH_NAMES = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function weekdayOf(iso) { return new Date(iso + 'T00:00:00Z').getUTCDay(); }
function formatDay(iso) { const d = new Date(iso + 'T00:00:00Z'); return `${DAY_NAMES[d.getUTCDay()]} ${d.getUTCDate()} ${MONTH_NAMES[d.getUTCMonth()]}`; }
function getToken() { return localStorage.getItem('gh_token') || ''; }
function saveToken() {
  const v = $('token-input').value.trim();
  if (v) localStorage.setItem('gh_token', v); else localStorage.removeItem('gh_token');
  hideTokenModal(); init();
}
function showTokenModal() { $('token-input').value = getToken(); $('token-modal').classList.add('show'); }
function hideTokenModal() { $('token-modal').classList.remove('show'); }

// ── data access: GitHub API when token present, else static fetch ──
async function ghFetch(path, opts = {}) {
  const res = await fetch(`https://api.github.com/repos/${REPO}/${path}`, {
    ...opts,
    headers: { 'Authorization': `Bearer ${getToken()}`, 'Accept': 'application/vnd.github+json', ...(opts.headers || {}) }
  });
  if (!res.ok) { const e = await res.json().catch(() => ({})); throw new Error(e.message || `GitHub API ${res.status}`); }
  return res.json();
}
const b64decode = s => decodeURIComponent(escape(atob(s.replace(/\n/g, ''))));
const b64encode = s => btoa(unescape(encodeURIComponent(s)));

async function readRepoFile(path) {
  if (getToken()) {
    const d = await ghFetch(`contents/${path}?t=${Date.now()}`);
    return { text: b64decode(d.content), sha: d.sha };
  }
  const res = await fetch(`../${path}?t=${Date.now()}`);
  if (!res.ok) throw new Error(`fetch ${path}: ${res.status}`);
  return { text: await res.text(), sha: '' };
}
async function commitFile(path, content, sha, message) {
  const body = { message, content: b64encode(content) };
  if (sha) body.sha = sha;
  return ghFetch(`contents/${path}`, { method: 'PUT', body: JSON.stringify(body) });
}

// ── boot ─────────────────────────────────────────────────────
function switchPerson(id) { location.search = `?person=${id}`; }

async function init() {
  try {
    const params = new URLSearchParams(location.search);
    const idx = await readRepoFile('people/index.json').then(r => JSON.parse(r.text));
    personId = params.get('person') || localStorage.getItem('last_person') || idx.people[0];
    if (!idx.people.includes(personId)) personId = idx.people[0];
    localStorage.setItem('last_person', personId);

    $('person-switch').innerHTML = idx.people.map(p =>
      `<option value="${p}" ${p === personId ? 'selected' : ''}>${p[0].toUpperCase() + p.slice(1)}</option>`).join('');

    P = JSON.parse((await readRepoFile(`people/${personId}/data.json`)).text);
    document.documentElement.style.setProperty('--accent', P.dashboard.accent || '#4f8ef7');
    $('person-name').textContent = P.name;
    document.title = `Training — ${P.name}`;

    // workout log (non-fatal if missing)
    try {
      const log = await readRepoFile(P.files.workoutLog);
      logContent = log.text; logSha = log.sha;
    } catch (e) { logContent = ''; logSha = ''; }
    selectDate(todayISO());

    // skill state (only if enabled)
    if (P.skills?.enabled && P.files.skillState) {
      try {
        const s = await readRepoFile(P.files.skillState);
        skillState = parseSkillState(s.text);
      } catch (e) { skillState = {}; }
    }

    $('boot-msg').classList.add('hidden');
    buildNav();
    showView(P.dashboard.tabs[0]);
  } catch (e) {
    $('boot-msg').textContent = 'Failed to load: ' + e.message +
      (getToken() ? '' : ' — if the repo is private, set a token via ⚙︎.');
  }
}

// ── navigation ───────────────────────────────────────────────
const TAB_LABELS = { today: '📅 Today', log: '📓 Log', skills: '🤸 Skills', nutrition: '🥩 Nutrition' };
function buildNav() {
  $('nav').innerHTML = P.dashboard.tabs.map(t =>
    `<button class="nav-link" id="tab-${t}" onclick="showView('${t}')">${TAB_LABELS[t] || t}</button>`).join('');
}
function showView(view) {
  P.dashboard.tabs.forEach(t => $(`tab-${t}`)?.classList.toggle('active', t === view));
  const render = { today: renderToday, log: renderLog, skills: renderSkills, nutrition: renderNutrition }[view];
  $('views').innerHTML = render ? render() : '';
  if (view === 'today') afterRenderToday();
}

// ── readiness (subjective, unified for everyone) ─────────────
function readinessKey(date) { return `ready_${personId}_${date}`; }
function storedReadiness(date) {
  try { return JSON.parse(localStorage.getItem(readinessKey(date))) || {}; } catch { return {}; }
}
function getReadiness() { return readiness; }
function setReadiness(k, v) {
  readiness[k] = Number(v);
  try { localStorage.setItem(readinessKey(selectedDate), JSON.stringify(readiness)); } catch {}
  updateReadinessBadge();
}
function readinessStatus(r) {
  const vals = READY_FIELDS.map(f => r[f.key]).filter(v => v >= 1);
  if (vals.length < READY_FIELDS.length) return null;
  const poor = vals.filter(v => v <= 2).length;
  if (poor >= 2) return 'red';
  if (poor === 1) return 'amber';
  return 'green';
}
const READY_ADVICE = {
  green: 'Train as planned.',
  amber: 'Keep the session, cut top-end volume ~20%, hold loads.',
  red:   'Easy/recovery only — apply the removal hierarchy (see shared/training_principles.md).'
};
function updateReadinessBadge() {
  const el = $('ready-badge'); if (!el) return;
  const s = readinessStatus(getReadiness());
  if (!s) { el.innerHTML = '<span class="muted">Rate all four to get today\'s call.</span>'; return; }
  const advice = (s === 'green' && deloadActive()) ? 'Deload week — train as shown at reduced volume; hold loads.' : READY_ADVICE[s];
  el.innerHTML = `<span class="badge ${s}">${s.toUpperCase()}</span><div class="ready-advice">${advice}</div>`;
}

// ── log parsing ──────────────────────────────────────────────
function splitEntries(content) {
  return content.split(/\n(?=## \d{4}-\d{2}-\d{2})/).filter(x => /^## \d{4}/.test(x.trim()));
}

// ── entry model: a logged entry ⇄ form fields ────────────────
// Anything the form doesn't show (extra lines, unknown sections, exercises no longer in the plan)
// is carried through untouched, so updating an entry never drops content.
const splitRow = line => line.split('|').slice(1, -1).map(c => c.trim());
const splitReps = r => /^\d+([\/,]\d+)*$/.test(r) ? r.split(/[\/,]/) : (r ? [r] : []);
const stripMin = v => v.replace(/(\s*min)+$/i, '');
function parseEntry(block) {
  const lines = block.replace(/\s+$/, '').split('\n');
  const h = lines[0].match(/^## (\d{4}-\d{2}-\d{2})\s*\|\s*(\w+)/) || [];
  const e = { date: h[1], type: h[2], ready: {}, rpe: '', notes: '', headExtra: [], lifts: null, endurance: null, rawSections: [] };
  let sec = null, cont = null;   // current ### section; field that continuation lines belong to
  for (const line of lines.slice(1)) {
    const field = line.match(/^- (\w+):\s?(.*)$/);
    if (line.startsWith('### ')) {
      const title = line.slice(4).trim();
      if (/^(Key lifts|Strength)\b/.test(title)) sec = e.lifts = { kind: 'lifts', title, rows: [], extra: [] };
      else if (/^(Endurance|Running)\b/.test(title)) sec = e.endurance = { kind: 'endurance', title, duration: '', detail: '', extra: [] };
      else { sec = { kind: 'raw', lines: [line] }; e.rawSections.push(sec); }
      cont = null; continue;
    }
    if (sec?.kind === 'raw') { sec.lines.push(line); continue; }
    // a multi-line note: lines after "- notes:" until a blank line, another field, or a table
    if (cont && line.trim() && !field && !line.startsWith('|')) { cont.obj[cont.key] += '\n' + line; continue; }
    cont = null;
    if (!line.trim()) continue;
    if (!sec) {
      const key = field?.[1], val = field?.[2] ?? '';
      if (READY_FIELDS.some(f => f.key === key) && /^\d/.test(val)) e.ready[key] = parseInt(val, 10);
      else if (key === 'rpe') e.rpe = val.replace(/\s*\/\s*10\s*$/, '');
      else if (key === 'notes') { e.notes = val; cont = { obj: e, key: 'notes' }; }
      else e.headExtra.push(line);
    } else if (sec.kind === 'lifts') {
      const cells = line.startsWith('|') ? splitRow(line) : [];
      if (cells[0] === 'Exercise' || (cells.length && cells.every(c => /^[-:\s]*$/.test(c)))) continue;   // header / separator row
      if (cells.length >= 3) sec.rows.push({ name: cells[0], reps: cells[1], load: cells[2], note: cells[3] || '' });
      else sec.extra.push(line);
    } else {
      if (field?.[1] === 'duration') sec.duration = stripMin(field[2]);
      else if (field?.[1] === 'notes') { sec.detail = field[2]; cont = { obj: sec, key: 'detail' }; }
      else sec.extra.push(line);
    }
  }
  return e;
}
function entryToMd(e) {
  let md = `## ${e.date} | ${e.type}\n`;
  READY_FIELDS.forEach(f => { if (e.ready[f.key]) md += `- ${f.key}: ${e.ready[f.key]}/5\n`; });
  if (e.rpe) md += `- rpe: ${e.rpe}/10\n`;
  if (e.notes) md += `- notes: ${e.notes}\n`;
  e.headExtra.forEach(l => { md += `${l}\n`; });
  const L = e.lifts, E = e.endurance;
  if (L && (L.rows.length || L.extra.length)) {
    md += `\n### ${L.title}\n| Exercise | Reps | Load | Notes |\n|---|---|---|---|\n`;
    L.rows.forEach(r => { md += `| ${r.name} | ${r.reps} | ${r.load || '—'} | ${r.note ? r.note + ' ' : ''}|\n`; });
    L.extra.forEach(l => { md += `${l}\n`; });
  }
  if (E && (E.duration || E.detail || E.extra.length)) {
    md += `\n### ${E.title}\n`;
    if (E.duration) md += `- duration: ${E.duration}min\n`;
    if (E.detail) md += `- notes: ${E.detail}\n`;
    E.extra.forEach(l => { md += `${l}\n`; });
  }
  e.rawSections.forEach(sec => { md += `\n${sec.lines.join('\n').replace(/\s+$/, '')}\n`; });
  return md;
}
// Where the entry for `date` sits: [start, blockEnd) is the entry text, `end` is past its "---".
function findEntryRange(content, date) {
  const m = new RegExp(`^## ${date}\\b.*$`, 'm').exec(content);
  if (!m) return null;
  const from = m.index + m[0].length, rest = content.slice(from);
  const sep = /\n---[ \t]*(?=\n|$)/.exec(rest), next = /\n## \d{4}-\d{2}-\d{2}/.exec(rest);
  if (sep && (!next || sep.index < next.index))
    return { start: m.index, blockEnd: from + sep.index, end: from + sep.index + sep[0].length, closed: true };
  const stop = next ? from + next.index + 1 : content.length;   // separator missing: stop at the next entry
  return { start: m.index, blockEnd: stop, end: stop, closed: false };
}
function findEntry(content, date) {
  const r = findEntryRange(content, date);
  return r ? parseEntry(content.slice(r.start, r.blockEnd)) : null;
}
// Logged date → replace that entry. New date → insert before the first later entry, keeping date order.
function upsertEntry(content, date, md) {
  content = content.replace(/\s*$/, '\n');
  const r = findEntryRange(content, date);
  if (r) {
    const sep = r.closed ? '\n---' : (r.end < content.length ? '\n---\n\n' : '\n---\n');
    return { content: content.slice(0, r.start) + md + sep + content.slice(r.end), action: 'Update' };
  }
  const re = /^## (\d{4}-\d{2}-\d{2})/gm; let m;
  while ((m = re.exec(content))) if (m[1] > date) return { content: content.slice(0, m.index) + md + '\n---\n\n' + content.slice(m.index), action: 'Log' };
  return { content: content + `\n${md}\n---\n`, action: 'Log' };
}

// "Previous" values: the latest entry of this session type before `beforeDate`
function parseLastLoads(sessionType, beforeDate) {
  const loads = {}; let found = null;
  for (const entry of splitEntries(logContent)) {
    const h = entry.match(/^## (\d{4}-\d{2}-\d{2})\s*\|\s*(\w+)/);
    if (h && h[2] === sessionType && h[1] < beforeDate) found = entry;   // entries are in date order
  }
  if (!found) return loads;
  const table = found.match(/### (Key lifts|Strength)[\s\S]*?(?=\n###|\n---|\n## |$)/);
  if (!table) return loads;
  for (const line of table[0].split('\n')) {
    const cols = line.split('|').map(s => s.trim()).filter(Boolean);
    if (cols.length >= 3 && !/^[-—:\s]+$/.test(cols[1]) && cols[0] !== 'Exercise') {
      // col 1 is per-set reps ("8/7/6") in new entries, or a target ("3×8") in old ones
      const reps = /^\d+([\/,]\d+)*$/.test(cols[1]) ? cols[1].split(/[\/,]/).map(Number) : null;
      loads[cols[0].toLowerCase()] = { load: cols[2], reps };
    }
  }
  return loads;
}
function getLoad(name) {
  const key = name.toLowerCase();
  for (const k of Object.keys(lastLoads)) if (k === key || key.startsWith(k) || k.startsWith(key)) return lastLoads[k];
  return null;
}
// "3×6–8 @ RPE 7–8" → {sets:3, top:8};  "2×20–40 s" → {sets:2, top:40};  "3×8/leg" → {sets:3, top:8}
function parseTarget(target) {
  const sets = Number((target.match(/^(\d+)\s*×/) || [])[1]) || 3;
  const m = target.match(/×\s*(\d+)(?:\s*[–-]\s*(\d+))?/);
  const top = m ? Number(m[2] || m[1]) : null;
  return { sets, top };
}

// ── mesocycle / deload ───────────────────────────────────────
// The Sunday review sets mesocycle.deload.weekOf (a Monday) when the coming week is a deload and
// removes it once the deload has been logged. Absent = normal week. deloadRules is static prose.
function addDaysISO(iso, n) { const d = new Date(iso + 'T00:00:00Z'); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); }
function deloadInfo(date = todayISO()) {
  const m = P.mesocycle; if (!m) return null;
  const weekOf = m.deload?.weekOf; if (!weekOf) return { state: 'none', m };
  const start = weekOf, end = addDaysISO(weekOf, 6), today = date;
  return { state: today < start ? 'upcoming' : (today > end ? 'ended' : 'active'), start, end, m };
}
function deloadActive(date = selectedDate) { return deloadInfo(date)?.state === 'active'; }
// gym targets during a deload: one set fewer at the same loads ("3×8–12" → "2×8–12")
function sessionSets(t) { return deloadActive() ? Math.max(1, t.sets - 1) : t.sets; }
function displayTarget(target) {
  const t = parseTarget(target), sets = sessionSets(t);
  return sets === t.sets ? target : target.replace(/^\d+(?=\s*×)/, String(sets));
}

// ── TODAY view ───────────────────────────────────────────────
function renderToday() {
  const day = new Date().getDay();
  const WEEK_ORDER = [1, 2, 3, 4, 5, 6, 0];   // display Monday-first
  const weekHtml = WEEK_ORDER.map(d => {
    const s = P.sessions[P.week[d]];
    return `<div class="day ${d === day ? 'today' : ''}"><b>${DAY_NAMES[d]}</b>${esc(s ? (s.label.split('—')[0].trim()) : P.week[d])}</div>`;
  }).join('');

  const types = P.logSessionTypes.includes(currentType) ? P.logSessionTypes : [...P.logSessionTypes, currentType];
  const typeOptions = types.map(t =>
    `<option value="${t}" ${t === currentType ? 'selected' : ''}>${t}</option>`).join('');

  const readyHtml = READY_FIELDS.map(f => {
    const v = getReadiness()[f.key] || '';
    return `<div class="ready-item"><label>${f.label}</label>
      <select onchange="setReadiness('${f.key}', this.value)">
        <option value="">–</option>${[1,2,3,4,5].map(n => `<option ${n == v ? 'selected' : ''}>${n}</option>`).join('')}
      </select></div>`;
  }).join('');

  const dl = deloadInfo();
  let mesoHtml = '';
  if (dl) {
    const pos = `Mesocycle: week ${esc(dl.m.week)} of ${esc(dl.m.pattern)}`;
    const rules = dl.m.deloadRules ? `<div>${esc(dl.m.deloadRules)}</div>` : '';
    if (dl.state === 'active')        mesoHtml = `<div class="deload"><b>🔻 DELOAD WEEK</b> · ${dl.start} → ${dl.end}${rules}<div class="meso">${pos}</div></div>`;
    else if (dl.state === 'upcoming') mesoHtml = `<div class="deload"><b>🔻 Deload week starts ${dl.start}</b>${rules}<div class="meso">${pos}</div></div>`;
    else if (dl.state === 'ended')    mesoHtml = `<div class="meso">${pos} · deload week of ${dl.start} ended — counter resets at the next Sunday review</div>`;
    else                              mesoHtml = `<div class="meso">${pos}</div>`;
  }

  return `
  <div class="card"><h2>Week</h2><div class="week">${weekHtml}</div>${mesoHtml}</div>

  <div class="card">
    <h2>Morning readiness (1–5, 5 = best)${selectedDate !== todayISO() ? ` · ${formatDay(selectedDate)}` : ''}</h2>
    <div class="ready-grid">${readyHtml}</div>
    <div id="ready-badge"></div>
  </div>

  <div class="card">
    <h2>Session</h2>
    <div class="field"><label>Date</label>
      <input type="date" id="entry-date" value="${selectedDate}" max="${todayISO()}" onchange="changeDate(this.value)">
      <div class="status-msg" id="date-status"></div>
    </div>
    <div class="field"><label>Session type</label>
      <select class="select-full" id="session-type" onchange="changeType(this.value)">${typeOptions}</select>
    </div>
    <div id="session-body" style="margin-top:12px"></div>
  </div>

  <div class="card">
    <h2>Save entry</h2>
    <div class="field"><label>RPE (1–10)</label><input type="text" id="entry-rpe" placeholder="7" value="${esc(dayEntry?.rpe || '')}"></div>
    <div class="field"><label>Notes</label><textarea id="entry-notes" rows="2" placeholder="what felt hard, what moved well, any pain">${esc(dayEntry?.notes || '')}</textarea></div>
    <button class="btn" id="save-btn" onclick="saveEntry()" ${getToken() ? '' : 'disabled'}>${dayEntry ? 'Update' : 'Add'} entry · ${formatDay(selectedDate)}</button>
    ${getToken() ? '' : '<div class="status-msg muted">Set a GitHub token (⚙︎) to enable saving.</div>'}
    <div class="status-msg" id="save-msg"></div>
  </div>`;
}
function afterRenderToday() { updateReadinessBadge(); renderSessionBody(); }
function changeType(t) { currentType = t; renderSessionBody(); }
function selectDate(date) {
  selectedDate = date;
  dayEntry = findEntry(logContent, date);
  currentType = dayEntry?.type || P.week[String(weekdayOf(date))] || 'REST';
  readiness = dayEntry ? { ...dayEntry.ready } : storedReadiness(date);
}
function changeDate(v) {
  if (!/^\d{4}-\d{2}-\d{2}$/.test(v) || v > todayISO()) { $('entry-date').value = selectedDate; return; }
  selectDate(v); showView('today');
}
function renderDateStatus() {
  const el = $('date-status'); if (!el) return;
  if (!dayEntry) { el.innerHTML = '<span class="muted">Not logged yet — saving adds a new entry.</span>'; return; }
  el.innerHTML = dayEntry.type === currentType
    ? '<span class="badge green">Logged</span> <span class="muted">Fields show the saved entry — saving updates it.</span>'
    : `<span class="badge amber">Logged as ${esc(dayEntry.type)}</span> <span class="muted">Saving replaces it with ${esc(currentType)}.</span>`;
}

function renderSessionBody() {
  const s = P.sessions[currentType];
  const el = $('session-body'); if (!el) return;
  renderDateStatus();
  if (!s) { el.innerHTML = `<div class="muted">No plan defined for ${esc(currentType)} — log it free-form below.</div>`; return; }
  let html = `<h3>${esc(s.label)}</h3>`;
  if (s.note) html += `<div class="note">${esc(s.note)}</div>`;
  const deload = deloadActive();
  if (deload && s.kind === 'gym') html += `<div class="deload">🔻 <b>Deload week</b> — one set fewer per exercise (targets below are already reduced); hold loads.</div>`;
  if (deload && s.kind === 'endurance') html += `<div class="deload">🔻 <b>Deload week</b> — ${esc(P.mesocycle.deloadRules || 'easy only, no quality work')}</div>`;

  if (s.kind === 'gym') {
    lastLoads = parseLastLoads(currentType, selectedDate);
    const logged = dayEntry?.lifts?.rows || [], used = new Set();
    formRows = s.exercises.map((ex, j) => {
      const k = logged.findIndex((r, i) => !used.has(i) && r.name.toLowerCase() === ex.name.toLowerCase());
      if (k !== -1) used.add(k);
      return { name: ex.name, target: ex.target, stub: ex.stub, logged: logged[k] || null, order: k !== -1 ? k : logged.length + j };
    });
    logged.forEach((r, i) => { if (!used.has(i)) formRows.push({ name: r.name, target: '', stub: '', logged: r, order: i }); });
    formRows.sort((a, b) => a.order - b.order);   // logged rows keep their logged order; unlogged plan rows follow
    html += formRows.map((row, i) => {
      const last = getLoad(row.name);
      const t = row.target ? parseTarget(row.target) : { sets: 1, top: null };
      const reps = row.logged ? splitReps(row.logged.reps) : [];
      row.n = Math.max(row.target ? sessionSets(t) : 1, reps.length);
      const hitTop = !deload && row.target && last?.reps && t.top && last.reps.length >= t.sets && last.reps.every(r => r >= t.top);
      const repInputs = Array.from({ length: row.n }, (_, j) =>
        `<input class="rep-input" id="rep-${i}-${j}" inputmode="numeric" value="${esc(reps[j] ?? '')}" placeholder="${esc(last?.reps?.[j] ?? (t.top || ''))}">`
      ).join('');
      const load = row.logged ? (row.logged.load === '—' ? '' : row.logged.load) : (last?.load || '');
      return `<div class="ex-row">
        <div class="ex-head">
          <span class="exname">${esc(row.name)}</span>
          <span class="target">${row.target ? esc(displayTarget(row.target)) : 'logged · not in current plan'}</span>
          ${hitTop ? '<span class="hint-up">↑ add load</span>' : ''}
        </div>
        <div class="ex-inputs">
          <input class="load-input" id="load-${i}" value="${esc(load)}" placeholder="${esc(row.stub || '')}">
          <span class="ex-x">×</span>${repInputs}<span class="ex-reps-label">reps</span>
        </div>
        ${last ? `<div class="ex-last">Previous: ${esc(last.load)}${last.reps ? ' · ' + last.reps.join('/') : ''}</div>` : ''}
      </div>`;
    }).join('');
    if (s.addon) html += `<div class="note">➕ ${esc(s.addon)}</div>`;
    if (s.mobility) html += `<div class="note">🧘 ${esc(s.mobility)}</div>`;
  } else if (s.kind === 'endurance') {
    if (s.purpose) html += `<div class="note"><b>Purpose:</b> ${esc(s.purpose)}</div>`;
    if (s.options) html += `<ul class="opts">${s.options.map(o => `<li>${esc(o)}</li>`).join('')}</ul>`;
    if (s.ladder) {
      const lvlKey = currentType === 'CYCLING_VO2MAX' ? 'vo2max' : (currentType === 'CYCLING_THRESHOLD' ? 'threshold' : null);
      const lvl = lvlKey ? (P.cycling?.levels?.[lvlKey] || 1) : null;
      const ftp = P.cycling?.ftp?.watts;
      html += `<ul class="opts">${s.ladder.map((o, i) => {
        const cur = lvl !== null && i === lvl - 1;
        return `<li${cur ? ' style="font-weight:600"' : ' style="opacity:.55"'}>${cur ? '▶ ' : ''}${esc(o)}</li>`;
      }).join('')}</ul>`;
      if (lvl !== null) html += `<div class="note">📈 Current level: L${lvl}${ftp ? ` · FTP ${ftp} W` : ' · FTP not tested yet — ride by RPE (Zwift Ramp Test pending)'}</div>`;
    }
    if (s.prep) html += `<div class="note">🔧 Prep: ${esc(s.prep)}</div>`;
    if (s.fueling) html += `<div class="note">⛽ ${esc(s.fueling)}</div>`;
    html += `<div class="row2" style="margin-top:8px">
      <div class="field"><label>Duration (min)</label><input type="text" id="end-duration" value="${esc(dayEntry?.endurance?.duration || '')}"></div>
      <div class="field"><label>Detail (power/pace/intervals)</label><input type="text" id="end-detail" value="${esc(dayEntry?.endurance?.detail || '')}"></div>
    </div>`;
  } else if (s.kind === 'mobility') {
    html += `<table><tr><th>Exercise</th><th class="num">Duration</th></tr>` +
      (s.exercises || []).map(ex => `<tr><td>${esc(ex.name)}</td><td class="num target">${esc(ex.target)}</td></tr>`).join('') + `</table>`;
  }
  el.innerHTML = html;
}

// ── save entry ───────────────────────────────────────────────
function collectForm() {
  const s = P.sessions[currentType] || {};
  const keep = dayEntry && dayEntry.type === currentType;   // sections this form doesn't render survive only if the type is unchanged
  const e = {
    date: selectedDate, type: currentType, ready: { ...readiness },
    rpe: $('entry-rpe').value.trim(), notes: $('entry-notes').value.trim(),
    headExtra: dayEntry?.headExtra || [], rawSections: dayEntry?.rawSections || [],
    lifts: keep ? dayEntry.lifts : null, endurance: keep ? dayEntry.endurance : null
  };
  if (s.kind === 'gym') {
    const rows = formRows.map((row, i) => {
      const input = $(`load-${i}`);
      const load = input?.value.trim();
      const reps = Array.from({ length: row.n }, (_, j) => $(`rep-${i}-${j}`)?.value.trim()).filter(Boolean);
      const touched = reps.length || (load && (row.logged || load !== input.defaultValue));
      if (!touched) return null;   // untouched exercise → not logged; clearing a logged one removes it
      const fallback = row.target ? displayTarget(row.target).split('@')[0].trim() : '—';
      return { name: row.name, reps: reps.length ? reps.join('/') : fallback, load, note: row.logged?.note || '' };
    }).filter(Boolean);
    e.lifts = { kind: 'lifts', title: dayEntry?.lifts?.title || 'Key lifts', rows, extra: dayEntry?.lifts?.extra || [] };
  } else if (s.kind === 'endurance') {
    e.endurance = { kind: 'endurance', title: dayEntry?.endurance?.title || 'Endurance',
      duration: stripMin($('end-duration')?.value.trim() || ''), detail: $('end-detail')?.value.trim() || '',
      extra: dayEntry?.endurance?.extra || [] };
  }
  return e;
}
async function saveEntry() {
  const msg = $('save-msg');
  try {
    $('save-btn').disabled = true;
    msg.textContent = 'Saving…';
    const fresh = await readRepoFile(P.files.workoutLog);   // re-read to get current sha
    if (!dayEntry && findEntryRange(fresh.text, selectedDate)) {
      // logged from another device since this page loaded — show that entry rather than overwrite it
      logContent = fresh.text; logSha = fresh.sha;
      selectDate(selectedDate); showView('today');
      $('save-msg').textContent = '✗ This day was just logged from another device — its entry is shown now; save again to update it.';
      return;
    }
    const { content, action } = upsertEntry(fresh.text, selectedDate, entryToMd(collectForm()));
    await commitFile(P.files.workoutLog, content, fresh.sha, `${action} ${currentType} ${selectedDate} — ${P.name} (dashboard)`);
    logContent = content;
    selectDate(selectedDate); showView('today');   // reload the form from the saved entry
    $('save-msg').textContent = '✓ Saved.';
  } catch (e) {
    msg.textContent = '✗ ' + e.message;
  } finally { $('save-btn').disabled = false; }
}

// ── LOG view ─────────────────────────────────────────────────
function formatEntryBody(body) {
  const lines = body.split('\n');
  let html = '', table = [];
  const flushTable = () => {
    if (!table.length) return;
    const rows = table.filter(r => !/^[\s|:-]+$/.test(r));           // drop separator row
    html += '<table style="margin:4px 0">' + rows.map((r, i) => {
      const cells = r.split('|').map(c => c.trim()).filter(Boolean);
      const tag = i === 0 ? 'th' : 'td';
      return `<tr>${cells.map(c => `<${tag}>${esc(c)}</${tag}>`).join('')}</tr>`;
    }).join('') + '</table>';
    table = [];
  };
  for (const line of lines) {
    const t = line.trim();
    if (t.startsWith('|')) { table.push(t); continue; }
    flushTable();
    if (!t) continue;
    if (t.startsWith('###')) html += `<div class="cat-title" style="margin:8px 0 4px">${esc(t.replace(/^#+\s*/, ''))}</div>`;
    else html += `<div class="muted" style="font-size:12.5px">${esc(t.replace(/^-\s*/, ''))}</div>`;
  }
  flushTable();
  return html;
}
function renderLog() {
  const entries = splitEntries(logContent).reverse().slice(0, 30);
  if (!entries.length) return `<div class="card"><h2>Workout log</h2><div class="muted">No entries yet.</div></div>`;
  const html = entries.map(e => {
    const h = e.match(/^## (\d{4}-\d{2}-\d{2})\s*\|\s*(\w+)/);
    const body = e.replace(/^## .*$/m, '').replace(/^---\s*$/gm, '').trim();
    return `<div class="entry"><div class="ehead">${h ? h[1] : ''} <span>${h ? h[2] : ''}</span></div>${formatEntryBody(body)}</div>`;
  }).join('');
  return `<div class="card"><h2>Workout log — latest ${entries.length}</h2>${html}</div>`;
}

// ── SKILLS view ──────────────────────────────────────────────
function parseSkillState(text) {
  const state = {};
  const block = text.match(/SKILL_STATE[\s\S]*?-->/);
  if (!block) return state;
  for (const line of block[0].split('\n')) {
    const m = line.match(/^\s*(\w+):\s*(\d+)\s*\/\s*(\d+)/);
    if (m) state[m[1]] = { level: +m[2], max: +m[3] };
  }
  return state;
}
function renderSkills() {
  const ladders = P.skills?.ladders || {};
  const cats = [...new Set(Object.values(ladders).map(l => l.cat))];
  let html = '';
  for (const cat of cats) {
    html += `<div class="cat-title">${esc(cat)}</div>`;
    for (const [key, l] of Object.entries(ladders)) {
      if (l.cat !== cat) continue;
      const st = skillState[key] || { level: 0, max: l.levels.length };
      const stage = l.levels[Math.max(0, st.level - 1)] || '—';
      const done = st.level >= st.max;
      html += `<div class="skill">
        <div class="head"><span class="exname">${esc(l.name)} ${done ? '✓' : ''}</span><span class="stage">${st.level}/${st.max} — ${esc(stage)}</span></div>
        <div class="bar"><i style="width:${(st.level / st.max) * 100}%"></i></div>
      </div>`;
    }
  }
  return `<div class="card"><h2>Calisthenics skills</h2>
    ${html || '<div class="muted">No ladders configured.</div>'}</div>`;
}

// ── NUTRITION view (immutable) ───────────────────────────────
function renderNutrition() {
  const n = P.nutrition;
  const t = n.totals;
  const mealHtml = n.meals.map(m => `
    <div class="card"><h2>${esc(m.name)}</h2>
      <table>
        <tr><th>Item</th><th class="num">Qty</th><th class="num">P</th><th class="num">C</th><th class="num">F</th><th class="num">kcal</th></tr>
        ${m.items.map(i => `<tr><td>${esc(i.item)}</td><td class="num target">${esc(i.qty)}</td><td class="num">${i.p}</td><td class="num">${i.c}</td><td class="num">${i.f}</td><td class="num">${i.kcal}</td></tr>`).join('')}
        <tr class="totals"><td>Total</td><td></td><td class="num">${m.totals.p}</td><td class="num">${m.totals.c}</td><td class="num">${m.totals.f}</td><td class="num">${m.totals.kcal}</td></tr>
      </table>
    </div>`).join('');

  return `
  <div class="card">
    <h2>Daily targets</h2>
    <div class="note">${esc(n.style)}</div>
    <table>
      <tr><th>Protein</th><th>Carbs</th><th>Fat</th><th>Fiber</th><th>Calories</th></tr>
      <tr><td>${t.protein} g</td><td>${t.carbs} g</td><td>${t.fat} g</td><td>${t.fiber} g</td><td>${t.kcal} kcal</td></tr>
    </table>
  </div>
  ${mealHtml}
  <div class="card"><h2>Fueling</h2><ul class="opts">${n.fueling.map(f => `<li>${esc(f)}</li>`).join('')}</ul></div>
  <div class="card"><h2>Supplements</h2>
    <table><tr><th>Supplement</th><th>Dose</th><th>Timing</th></tr>
      ${n.supplements.map(s => `<tr><td class="exname">${esc(s.name)}</td><td class="target">${esc(s.dose)}</td><td class="target">${esc(s.timing)}</td></tr>`).join('')}
    </table>
    ${n.notes ? `<div class="note">${esc(n.notes)}</div>` : ''}
  </div>`;
}
